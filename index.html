<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALTA CAL PROFIT SHARE (iPhone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <!-- React + ReactDOM + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const Plus    = ({ size = 20 }) => <span style={{ fontSize: size }}>＋</span>;
    const X       = ({ size = 20 }) => <span style={{ fontSize: size }}>✕</span>;
    const Printer = ({ size = 20 }) => <span style={{ fontSize: size }}>🖨️</span>;

    if (!window.storage) {
      window.storage = {
        async list(prefix = '') { const keys=[]; for (let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if (!prefix || (k && k.startsWith(prefix))) keys.push(k);} return { keys }; },
        async get(key){ const value=localStorage.getItem(key); return value ? { value } : null; },
        async set(key,val){ localStorage.setItem(key,val); return true; },
        async delete(key){ localStorage.removeItem(key); return true; },
      };
    }

    const { useState, useEffect } = React;

    function App() {
      const [calculators, setCalculators] = useState([{
        id: 1, customerName: '', jobNumber: '', contractAmount: '',
        cashCheck: '', financeAmount: '', dealerFee: '', creditCard: '',
        creditCardFee: '', houseFeePercent: '', laborMaterial: '',
        rideAlong: '', rideAlongBonus: '', numRideAlongs: '',
        numVets: '', numReps: ''
      }]);

      const [showReport, setShowReport] = useState(false);
      const [reportName, setReportName] = useState('');
      const [savedReports, setSavedReports] = useState([]);
      const [showSavedReports, setShowSavedReports] = useState(false);

      useEffect(() => { loadSavedReports(); }, []);

      async function loadSavedReports() {
        const result = await window.storage.list('report:');
        const reports = [];
        for (const key of result.keys) {
          const data = await window.storage.get(key);
          if (data && data.value) reports.push({ key, ...JSON.parse(data.value) });
        }
        setSavedReports(reports);
      }

      function fmt(v){ const n=parseFloat(v)||0; return n.toLocaleString('en-US',{style:'currency',currency:'USD'}); }
      const c = calculators[0];
      const contract = parseFloat(c.contractAmount)||0;
      const housePct = parseFloat(c.houseFeePercent)||0;
      const houseAmt = contract*(housePct/100);
      const labor = parseFloat(c.laborMaterial)||0;
      const net = contract - houseAmt - labor;

      return (
        <div className="p-4">
          <h1 className="text-2xl font-bold text-center mb-4">iPhone Profit Share Calculator</h1>
          <div className="bg-white p-4 rounded-lg shadow-md space-y-3">
            <div>
              <label className="block text-sm font-bold mb-1">Contract Amount</label>
              <input className="w-full border px-3 py-2 rounded" placeholder="e.g. 20000"
                     value={c.contractAmount}
                     onChange={e=>setCalculators([{...c,contractAmount:e.target.value}])}/>
            </div>
            <div>
              <label className="block text-sm font-bold mb-1">House Fee %</label>
              <input className="w-full border px-3 py-2 rounded" placeholder="e.g. 10"
                     value={c.houseFeePercent}
                     onChange={e=>setCalculators([{...c,houseFeePercent:e.target.value}])}/>
            </div>
            <div>
              <label className="block text-sm font-bold mb-1">Labor & Material</label>
              <input className="w-full border px-3 py-2 rounded" placeholder="e.g. 6000"
                     value={c.laborMaterial}
                     onChange={e=>setCalculators([{...c,laborMaterial:e.target.value}])}/>
            </div>
          </div>

          <div className="mt-6 bg-blue-100 p-4 rounded-lg text-center">
            <h2 className="text-xl font-bold">Results</h2>
            <p>House Fee: <b>{fmt(houseAmt)}</b></p>
            <p>Total After Fees: <b>{fmt(net)}</b></p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
