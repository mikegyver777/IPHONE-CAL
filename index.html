<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALTA CAL PROFIT SHARE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React + ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel (so JSX works in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Simple icons (no imports)
    const Plus = ({ size = 20 }) => <span style={{ fontSize: size }}>＋</span>;
    const X = ({ size = 20 }) => <span style={{ fontSize: size }}>✕</span>;
    const Printer = ({ size = 20 }) => <span style={{ fontSize: size }}>🖨️</span>;

    // LocalStorage polyfill for GitHub Pages
    if (!window.storage) {
      window.storage = {
        async list(prefix = '') {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (!prefix || (k && k.startsWith(prefix))) keys.push(k);
          }
          return { keys };
        },
        async get(key) {
          const v = localStorage.getItem(key);
          return v ? { value: v } : null;
        },
        async set(key, val) {
          localStorage.setItem(key, val);
          return true;
        },
        async delete(key) {
          localStorage.removeItem(key);
          return true;
        },
      };
    }

    function App() {
      const [calculators, setCalculators] = useState([{ id: 1, contractAmount: '', houseFeePercent: '' }]);

      const calculate = (c) => {
        const contract = parseFloat(c.contractAmount || 0);
        const housePct = parseFloat(c.houseFeePercent || 0);
        const houseFee = (contract * housePct) / 100;
        const total = contract - houseFee;
        return { houseFee, total };
      };

      return (
        <div className="p-6">
          <h1 className="text-3xl font-bold mb-6 text-center text-blue-800">ALTA CAL PROFIT SHARE</h1>
          {calculators.map((c, i) => {
            const result = calculate(c);
            return (
              <div key={i} className="bg-white p-4 rounded shadow mb-6">
                <div className="mb-3">
                  <label className="font-bold block">Contract Amount ($)</label>
                  <input
                    type="number"
                    className="border w-full px-2 py-1 rounded"
                    value={c.contractAmount}
                    onChange={(e) => {
                      const arr = [...calculators];
                      arr[i].contractAmount = e.target.value;
                      setCalculators(arr);
                    }}
                  />
                </div>
                <div className="mb-3">
                  <label className="font-bold block">House Fee (%)</label>
                  <input
                    type="number"
                    className="border w-full px-2 py-1 rounded"
                    value={c.houseFeePercent}
                    onChange={(e) => {
                      const arr = [...calculators];
                      arr[i].houseFeePercent = e.target.value;
                      setCalculators(arr);
                    }}
                  />
                </div>
                <div className="bg-blue-50 p-3 rounded">
                  <p><strong>House Fee:</strong> ${result.houseFee.toFixed(2)}</p>
                  <p><strong>Total After Fee:</strong> ${result.total.toFixed(2)}</p>
                </div>
              </div>
            );
          })}
          <button
            onClick={() => setCalculators([...calculators, { id: calculators.length + 1 }])}
            className="bg-green-600 text-white font-bold px-4 py-2 rounded"
          >
            Add Calculator
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
