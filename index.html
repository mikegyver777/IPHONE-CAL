<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALTA CAL PROFIT SHARE (iPhone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <!-- React + ReactDOM + Babel (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    // --- icon substitutes (no lucide-react on plain HTML) ---
    const Plus    = ({ size = 20 }) => <span style={{ fontSize: size }}>＋</span>;
    const X       = ({ size = 20 }) => <span style={{ fontSize: size }}>✕</span>;
    const Printer = ({ size = 20 }) => <span style={{ fontSize: size }}>🖨️</span>;

    // --- localStorage helper (so Save/Delete works on GitHub Pages) ---
    if (!window.storage) {
      window.storage = {
        async list(prefix = '') { const keys=[]; for (let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if (!prefix || (k && k.startsWith(prefix))) keys.push(k);} return { keys }; },
        async get(key){ const value=localStorage.getItem(key); return value ? { value } : null; },
        async set(key,val){ localStorage.setItem(key,val); return true; },
        async delete(key){ localStorage.removeItem(key); return true; },
      };
    }

    const { useState, useEffect } = React;

    // === Your App (imports removed, export removed) ===
    function App() {
      const [calculators, setCalculators] = useState([{
        id: 1, customerName: '', jobNumber: '', contractAmount: '',
        cashCheck: '', financeAmount: '', dealerFee: '', creditCard: '',
        creditCardFee: '', houseFeePercent: '', laborMaterial: '',
        rideAlong: '', rideAlongBonus: '', numRideAlongs: '',
        numVets: '', numReps: ''
      }]);

      const [showReport, setShowReport] = useState(false);
      const [savedReports, setSavedReports] = useState([]);
      const [showSavedReports, setShowSavedReports] = useState(false);
      const [reportName, setReportName] = useState('');
      const [showSaveDialog, setShowSaveDialog] = useState(false);
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [printSingleCalc, setPrintSingleCalc] = useState(null);

      useEffect(() => { loadSavedReports(); }, []);

      async function loadSavedReports() {
        try {
          const result = await window.storage.list('report:');
          const reports = [];
          for (const key of result.keys) {
            try {
              const data = await window.storage.get(key);
              if (data && data.value) reports.push({ key, ...JSON.parse(data.value) });
            } catch (e) { console.log('Error loading report:', e); }
          }
          setSavedReports(reports);
        } catch { setSavedReports([]); }
      }

      function formatCurrency(value) {
        const n = Number(String(value).replace(/[,$]/g, '')) || 0;
        return n.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2});
      }
      function parseValue(v){ if (v==null||v==='') return 0; const n=parseFloat(String(v).replace(/[,$]/g,'')); return isNaN(n)?0:n; }
      function parseFee(amount, fee){
        if (!fee) return 0;
        const base = parseValue(amount);
        const pct  = parseFloat(String(fee).replace('%','')) || 0;
        return Math.round(base * pct) / 100; // 2-dec handled below by formatter
      }

      function calculateForOne(data) {
        const contractAmount   = parseValue(data.contractAmount);
        const houseFeePercent  = parseValue(data.houseFeePercent);
        const houseFeeAmount   = (contractAmount * houseFeePercent) / 100;

        const dealerFeeAmount     = parseFee(data.financeAmount, data.dealerFee);
        const creditCardFeeAmount = parseFee(data.creditCard, data.creditCardFee);

        const afterHouseFee   = contractAmount - houseFeeAmount;
        const totalAfterFees  = afterHouseFee - parseValue(data.laborMaterial) - dealerFeeAmount;
        const afterJobCost    = totalAfterFees;
        const percentOfContract = afterHouseFee > 0 ? (totalAfterFees / afterHouseFee) * 100 : 0;

        let vetRate = 25; if (percentOfContract >= 50) vetRate = 55; else if (percentOfContract >= 40) vetRate = 45; else if (percentOfContract >= 33) vetRate = 35;
        let repRate = 20; if (percentOfContract >= 50) repRate = 40; else if (percentOfContract >= 40) repRate = 30; else if (percentOfContract >= 33) repRate = 25;

        const vetsCount = parseValue(data.numVets);
        const repsCount = parseValue(data.numReps);
        const totalPeople = vetsCount + repsCount;

        const vetCommissionTotal = (totalAfterFees * vetRate) / 100;
        const repCommissionTotal = (totalAfterFees * repRate) / 100;

        const perVetPayout = totalPeople ? (vetCommissionTotal / totalPeople) : 0;
        const perRepPayout = totalPeople ? (repCommissionTotal / totalPeople) : 0;

        const rideAlongFeeAmount = parseValue(data.rideAlong);
        const rideAlongFeePerPerson = totalPeople ? rideAlongFeeAmount / totalPeople : 0;

        const creditCardFeePerPerson = totalPeople ? creditCardFeeAmount / totalPeople : 0;

        const finalPerVetPayout = perVetPayout - rideAlongFeePerPerson - creditCardFeePerPerson;
        const finalPerRepPayout = perRepPayout - rideAlongFeePerPerson - creditCardFeePerPerson;

        const finalTotalVetsPayout = finalPerVetPayout * vetsCount;
        const finalTotalRepsPayout = finalPerRepPayout * repsCount;

        const rideAlongBonusAmount = parseValue(data.rideAlongBonus);
        const totalRideAlongPayout = rideAlongFeeAmount + rideAlongBonusAmount;
        const numRideAlongs = parseValue(data.numRideAlongs);
        const perRideAlongPayout = numRideAlongs ? (totalRideAlongPayout / numRideAlongs) : 0;

        return {
          houseFeeAmount, dealerFeeAmount, totalAfterFees: afterJobCost, afterJobCost, percentOfContract,
          vetRate, repRate, perVetPayout, perRepPayout, rideAlongFeePerPerson, creditCardFeePerPerson,
          finalPerVetPayout, finalPerRepPayout, finalTotalVetsPayout, finalTotalRepsPayout,
          combinedPayout: finalTotalVetsPayout + finalTotalRepsPayout,
          totalRideAlongPayout, perRideAlongPayout
        };
      }

      function calculateTotals() {
        let totalVetPayout=0, totalRepPayout=0, totalRideAlongPayout=0, totalAfterFees=0;
        calculators.forEach(d => {
          const c = calculateForOne(d);
          totalVetPayout      += c.finalTotalVetsPayout;
          totalRepPayout      += c.finalTotalRepsPayout;
          totalRideAlongPayout+= c.totalRideAlongPayout;
          totalAfterFees      += c.totalAfterFees;
        });
        const totalProfit = totalAfterFees - totalVetPayout - totalRepPayout - totalRideAlongPayout;
        return { totalVetPayout, totalRepPayout, totalCombinedPayout: totalVetPayout+totalRepPayout, totalRideAlongPayout, totalProfit };
      }

      const totals = calculateTotals();

      // --- UI: cut for brevity; keep your existing JSX from earlier or the simplified version I gave you ---
      return (
        <div className="p-4">
          <h1 className="text-2xl font-bold mb-4 text-center">ALTA CAL PROFIT SHARE (iPhone)</h1>

          {/* Minimal inputs just to confirm it's running */}
          <div className="bg-white p-4 rounded shadow space-y-3">
            <label className="block text-sm font-bold">Contract Amount</label>
            <input className="w-full border px-3 py-2 rounded"
                   value={calculators[0].contractAmount}
                   onChange={e => setCalculators([{...calculators[0], contractAmount: e.target.value }])}/>
            <label className="block text-sm font-bold">House Fee %</label>
            <input className="w-full border px-3 py-2 rounded"
                   value={calculators[0].houseFeePercent}
                   onChange={e => setCalculators([{...calculators[0], houseFeePercent: e.target.value }])}/>
            <label className="block text-sm font-bold">Labor & Material</label>
            <input className="w-full border px-3 py-2 rounded"
                   value={calculators[0].laborMaterial}
                   onChange={e => setCalculators([{...calculators[0], laborMaterial: e.target.value }])}/>
          </div>

          <div className="mt-4 p-4 bg-blue-100 rounded text-center">
            {(() => {
              const c = calculateForOne(calculators[0]);
              const profit = c.afterJobCost - c.finalTotalVetsPayout - c.finalTotalRepsPayout - c.totalRideAlongPayout;
              return (
                <>
                  <p>House Fee: <b>{formatCurrency(c.houseFeeAmount)}</b></p>
                  <p>Total After Fees: <b>{formatCurrency(c.totalAfterFees)}</b></p>
                  <p>Profit (w/o team payouts entered): <b>{formatCurrency(profit)}</b></p>
                </>
              );
            })()}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
