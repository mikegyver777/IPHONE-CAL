<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alta Cal Profit Share</title>
  <!-- Tailwind so your className styles actually work -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <!-- React 18 UMD + ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel so the browser can compile JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Your app code -->
  <script type="text/babel">
    // 0) tiny icon replacements (no lucide-react needed)
    const Plus    = ({size=20}) => <span style={{fontSize:size}}>＋</span>;
    const X       = ({size=20}) => <span style={{fontSize:size}}>✕</span>;
    const Printer = ({size=20}) => <span style={{fontSize:size}}>🖨️</span>;

    // 1) localStorage-backed storage used by your code
    if (!window.storage) {
      window.storage = {
        async list(prefix='') { 
          const keys=[]; for (let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if (!prefix || k.startsWith(prefix)) keys.push(k);}
          return { keys };
        },
        async get(key){ const value=localStorage.getItem(key); return value ? { value } : null; },
        async set(key,val){ localStorage.setItem(key,val); return true; },
        async delete(key){ localStorage.removeItem(key); return true; },
      };
    }

    // 2) PASTE YOUR CLAUDE COMPONENT HERE:
    //    - Remove the two import lines
    //    - Change `export default function App()` to just `function App() { ... }`

    // --- BEGIN YOUR MODIFIED CODE ---
    // function App() {  ... all your code exactly as posted, unchanged otherwise ... }
    // --- END YOUR MODIFIED CODE ---

    // 3) Mount the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
