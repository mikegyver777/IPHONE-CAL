<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ALTA CAL PROFIT SHARE</title>
  <!-- Tailwind (for quick styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="max-w-4xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-center text-blue-800 mb-6">ALTA CAL PROFIT SHARE</h1>

    <div class="bg-white rounded-lg shadow p-5 space-y-4 border">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block font-semibold mb-1">Contract Amount ($)</label>
          <input id="contract" type="number" class="w-full border rounded px-3 py-2" placeholder="e.g. 52004">
        </div>
        <div>
          <label class="block font-semibold mb-1">House Fee (%)</label>
          <input id="housePct" type="number" class="w-full border rounded px-3 py-2" placeholder="e.g. 10">
        </div>
        <div>
          <label class="block font-semibold mb-1">Labor & Material ($)</label>
          <input id="labmat" type="number" class="w-full border rounded px-3 py-2" placeholder="e.g. 18000">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div>
          <label class="block font-semibold mb-1">Finance Amount ($)</label>
          <input id="finAmt" type="number" class="w-full border rounded px-3 py-2" placeholder="e.g. 30000">
        </div>
        <div>
          <label class="block font-semibold mb-1">Dealer Fee (%)</label>
          <input id="dealerPct" type="number" class="w-full border rounded px-3 py-2" placeholder="e.g. 9.99">
        </div>
        <div>
          <label class="block font-semibold mb-1">Credit Card Amount ($)</label>
          <input id="ccAmt" type="number" class="w-full border rounded px-3 py-2" placeholder="e.g. 1000">
        </div>
        <div>
          <label class="block font-semibold mb-1">Credit Card Fee (%)</label>
          <input id="ccPct" type="number" class="w-full border rounded px-3 py-2" placeholder="e.g. 3">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div>
          <label class="block font-semibold mb-1"># Vets</label>
          <input id="numVets" type="number" class="w-full border rounded px-3 py-2" value="0">
        </div>
        <div>
          <label class="block font-semibold mb-1"># Reps</label>
          <input id="numReps" type="number" class="w-full border rounded px-3 py-2" value="0">
        </div>
        <div>
          <label class="block font-semibold mb-1">Ride-Along Fee ($ total)</label>
          <input id="raFee" type="number" class="w-full border rounded px-3 py-2" value="0">
        </div>
        <div>
          <label class="block font-semibold mb-1">Ride-Along Bonus ($ total)</label>
          <input id="raBonus" type="number" class="w-full border rounded px-3 py-2" value="0">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block font-semibold mb-1"># Ride-Alongs</label>
          <input id="numRA" type="number" class="w-full border rounded px-3 py-2" value="0">
        </div>
        <div class="flex items-end">
          <button id="calcBtn" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded">
            Calculate
          </button>
        </div>
      </div>

      <!-- OUTPUT -->
      <div id="out" class="space-y-3">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div class="bg-blue-50 border border-blue-200 rounded p-3">
            <div class="font-bold">House Fee</div>
            <div id="houseFee" class="text-xl">$0.00</div>
          </div>
          <div class="bg-green-50 border border-green-200 rounded p-3">
            <div class="font-bold">Dealer Fee (from Finance)</div>
            <div id="dealerFee" class="text-xl">$0.00</div>
          </div>
        </div>

        <div class="bg-purple-50 border border-purple-200 rounded p-3 grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <div class="font-bold">Total After Fees</div>
            <div id="afterFees" class="text-2xl">$0.00</div>
          </div>
          <div>
            <div class="font-bold">Vet %</div>
            <div id="vetPct" class="text-2xl">25%</div>
          </div>
          <div>
            <div class="font-bold">Rep %</div>
            <div id="repPct" class="text-2xl">20%</div>
          </div>
        </div>

        <div class="bg-yellow-50 border border-yellow-200 rounded p-3">
          <div class="font-bold mb-1">Team Payouts</div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div>
              <div class="text-sm font-semibold">Per Vet</div>
              <div id="perVet" class="text-xl">$0.00</div>
            </div>
            <div>
              <div class="text-sm font-semibold">Per Rep</div>
              <div id="perRep" class="text-xl">$0.00</div>
            </div>
            <div>
              <div class="text-sm font-semibold">Ride-Along Per Person</div>
              <div id="perRA" class="text-xl">$0.00</div>
            </div>
          </div>
        </div>

        <div class="bg-gradient-to-r from-blue-400 to-blue-600 text-white rounded p-4 text-center">
          <div class="font-bold">Combined Payout</div>
          <div id="combined" class="text-3xl">$0.00</div>
        </div>

        <div class="bg-gradient-to-r from-yellow-400 to-orange-500 text-white rounded p-4 text-center">
          <div class="font-bold">Profit</div>
          <div id="profit" class="text-3xl">$0.00</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- utilities ---
    function currency(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(+n || 0); }
    function num(id){ const v=parseFloat(document.getElementById(id).value); return isNaN(v)?0:v; }

    // business logic: tiers based on percentOfContract = (afterFees)/(contract - houseFee)
    function tierRates(percentOfContract){
      let vet = 25, rep = 20;
      if (percentOfContract >= 50){ vet = 55; rep = 40; }
      else if (percentOfContract >= 40){ vet = 45; rep = 30; }
      else if (percentOfContract >= 33){ vet = 35; rep = 25; }
      return { vet, rep };
    }

    function calc(){
      const contract = num('contract');
      const housePct = num('housePct');
      const labmat   = num('labmat');
      const finAmt   = num('finAmt');
      const dealerPct= num('dealerPct');
      const ccAmt    = num('ccAmt');
      const ccPct    = num('ccPct');
      const numVets  = num('numVets');
      const numReps  = num('numReps');
      const raFee    = num('raFee');
      const raBonus  = num('raBonus');
      const numRA    = num('numRA');

      const people = Math.max(0, numVets + numReps);

      const houseFee = contract * housePct / 100;
      const afterHouse = contract - houseFee;

      const dealerFee = finAmt * (dealerPct/100);
      const ccFeeTotal = ccAmt * (ccPct/100);

      // "after fees" matches your earlier spec: contract - houseFee - labor&mat - dealerFee
      const afterFees = afterHouse - labmat - dealerFee;

      const percentOfContract = afterHouse > 0 ? (afterFees / afterHouse) * 100 : 0;
      const { vet: vetPct, rep: repPct } = tierRates(percentOfContract);

      const vetCommissionTotal = afterFees * (vetPct/100);
      const repCommissionTotal = afterFees * (repPct/100);

      // Split across *all* sales people (vets + reps), then subtract shared fees per person
      const perPersonRA = people > 0 ? (raFee / people) : 0;
      const perPersonCC = people > 0 ? (ccFeeTotal / people) : 0;

      const perVet = people > 0 ? (vetCommissionTotal / people) - perPersonRA - perPersonCC : 0;
      const perRep = people > 0 ? (repCommissionTotal / people) - perPersonRA - perPersonCC : 0;

      const totalVets = perVet * numVets;
      const totalReps = perRep * numReps;

      const totalRAOut = raFee + raBonus;
      const perRA = numRA > 0 ? (totalRAOut / numRA) : 0;

      const combined = totalVets + totalReps;
      const profit = afterFees - combined - totalRAOut; // house keeps what's left

      // write out
      document.getElementById('houseFee').textContent = currency(houseFee);
      document.getElementById('dealerFee').textContent = currency(dealerFee);
      document.getElementById('afterFees').textContent = currency(afterFees);
      document.getElementById('vetPct').textContent = vetPct + '%';
      document.getElementById('repPct').textContent = repPct + '%';
      document.getElementById('perVet').textContent = currency(perVet);
      document.getElementById('perRep').textContent = currency(perRep);
      document.getElementById('perRA').textContent  = currency(perRA);
      document.getElementById('combined').textContent = currency(combined);
      document.getElementById('profit').textContent   = currency(profit);
    }

    document.getElementById('calcBtn').addEventListener('click', calc);
  </script>
</body>
</html>
